<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportzstat - Tournament Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { margin: 0; background-color: #020617; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        * { box-sizing: border-box; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .sidebar { width: 280px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; flex-shrink: 0; z-index: 20; transition: transform 0.3s ease; }
        .sidebar-header { padding: 25px 20px; border-bottom: 1px solid #1e293b; }
        .back-link { color: #94a3b8; text-decoration: none; font-size: 0.85rem; font-weight: bold; display: inline-block; margin-bottom: 15px; transition: 0.2s; }
        .back-link:hover { color: #38bdf8; }
        .app-title { margin: 0; color: #3b82f6; letter-spacing: 1px; font-size: 1.2rem; text-transform: uppercase; }
        .app-subtitle { margin: 5px 0 0 0; color: #64748b; font-size: 0.75rem; }

        .nav-menu { flex: 1; overflow-y: auto; padding: 20px 0; }
        .nav-group-title { padding: 0 20px; font-size: 0.7rem; text-transform: uppercase; color: #64748b; font-weight: bold; letter-spacing: 1px; margin-bottom: 10px; margin-top: 15px; }
        .nav-item { padding: 12px 20px 12px 25px; color: #cbd5e1; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 0.95rem; border-left: 3px solid transparent; transition: 0.2s; }
        .nav-item:hover { background: #1e293b; color: white; }
        .nav-item.active { background: #1e293b; color: #38bdf8; border-left-color: #38bdf8; font-weight: bold; }
        
        /* MOBILE FIX: Adjusted padding and scrolling for content area */
        .content-area { flex: 1; overflow-y: auto; background: #020617; position: relative; }
        .hub-section { display: none; animation: fadeIn 0.3s ease; max-width: 1100px; margin: 0 auto; padding: 40px; }
        .hub-section.active { display: block; }
        
        .card { background: #0f172a; padding: 25px; border-radius: 12px; border: 1px solid #1e293b; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .card-title { margin-top: 0; color: #38bdf8; font-size: 1.1rem; margin-bottom: 15px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; font-weight:bold; }
        .input-group input, .input-group select { width: 100%; padding: 10px; background: #020617; border: 1px solid #334155; color: white; border-radius: 6px; outline: none; transition: 0.2s; }
        .input-group input:focus, .input-group select:focus { border-color: #38bdf8; }
        
        .btn-primary { background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background: #2563eb; }
        .btn-success { background: #10b981; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.85rem;}
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.75rem;}
        .btn-outline { background: transparent; color: #38bdf8; border: 1px dashed #38bdf8; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-action { background: #8b5cf6; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        .btn-action:hover { opacity: 0.9; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .tourney-grid { display: grid; grid-template-columns: 1.2fr 2fr; gap: 20px; align-items: start; margin-top: 20px; }
        .team-dual-pane { display: flex; gap: 10px; height: 300px; }
        .team-list-box { flex: 1; background: #0f172a; border: 1px solid #475569; border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
        .team-list-header { background: #334155; color: white; font-size: 0.8rem; padding: 8px; text-align: center; font-weight: bold; }
        .team-list-item { background: #1e293b; padding: 8px 10px; border-radius: 4px; font-size: 0.85rem; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; transition: 0.2s; }
        .team-list-item:hover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .custom-scroll { overflow-y: auto; padding: 5px; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        
        .pool-box { background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .pool-box-header { color: #f59e0b; font-weight: bold; margin-bottom: 10px; font-size: 0.95rem; border-bottom: 1px dashed #334155; padding-bottom: 5px; }
        .assigned-team-pill { background: #1e293b; border: 1px solid #3b82f6; padding: 6px 12px; border-radius: 4px; display: inline-flex; align-items: center; gap: 8px; margin: 4px; font-size: 0.85rem; }

        .sub-tab-nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; flex-wrap: wrap; }
        .sub-tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .sub-tab-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .sub-tab-pane { display: none; }
        .sub-tab-pane.active { display: block; }

        .pools-workspace { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .staging-sidebar { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; min-height: 250px; }
        .pools-container-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .postings-select { width: 100%; padding: 8px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 4px; outline:none;}
        
        .canvas-row { background: #1e293b; border: 1px solid #3b82f6; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap;}
        .canvas-name-input { background: #0f172a; border: 1px solid #475569; color: white; padding: 8px; border-radius: 4px; flex: 1; min-width: 200px; outline:none;}
        .canvas-teams { display: flex; gap: 15px; align-items: center; flex: 2; min-width: 300px;}
        .canvas-teams select { flex: 1; }

        .postings-grid { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
        .postings-grid th { background: #1e293b; color: #94a3b8; padding: 15px 20px; text-align: left; }
        .postings-grid td { padding: 20px; border-bottom: 1px solid #1e293b; background: #0f172a; vertical-align: middle;}

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.2s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: #0f172a; border: 1px solid #38bdf8; border-radius: 12px; padding: 25px; width: 400px; max-width: 90%; text-align: left; transform: translateY(20px); transition: 0.3s; box-shadow: 0 15px 30px rgba(0,0,0,0.7); position: relative;}
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-close { background: transparent; border: none; color: #94a3b8; font-size: 1.5rem; position: absolute; top: 10px; right: 15px; cursor: pointer; }
        .modal-close:hover { color: #ef4444; }

        .hidden { display: none !important; }
        .input-dark { background: #0f172a; color: white; border: 1px solid #475569; border-radius: 4px; padding: 6px; outline: none; }
        .input-dark:focus { border-color: #38bdf8; }
        .w-100 { width: 100%; }

        /* MOBILE RESPONSIVENESS AND SUPER ADMIN CLASSES */
        .super-admin-only { display: none !important; } /* Hidden by default until identity is verified */

        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 15; opacity: 0; transition: opacity 0.3s; }
        .sidebar-overlay.active { display: block; opacity: 1; }
        .mobile-header { display: none; align-items: center; justify-content: space-between; padding: 15px 20px; background: #0f172a; border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 5; }
        .menu-btn { background: none; border: none; color: #38bdf8; font-size: 1.8rem; cursor: pointer; padding: 0; margin-right: 15px; display: flex; align-items: center; }

        @media (max-width: 768px) {
            .sidebar { position: fixed; top: 0; left: 0; height: 100vh; transform: translateX(-100%); transition: transform 0.3s ease; z-index: 20; box-shadow: 4px 0 15px rgba(0,0,0,0.8); }
            .sidebar.open { transform: translateX(0); }
            .mobile-header { display: flex; }
            .hub-section { padding: 20px; }
            
            .grid-2 { grid-template-columns: 1fr; }
            .tourney-grid { grid-template-columns: 1fr; }
            .team-dual-pane { flex-direction: column; height: auto; }
            .team-list-box { height: 250px; }
            .pools-workspace { grid-template-columns: 1fr; }
            .sub-tab-nav { flex-direction: column; gap: 5px; }
            .canvas-row { flex-direction: column; align-items: stretch; gap: 10px; }
            .canvas-teams { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <!-- MOBILE OVERLAY -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR NAVIGATION -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="../index.html" class="back-link">← Back to Dashboard</a>
            <h2 class="app-title">TOURNAMENT HUB</h2>
            <p class="app-subtitle">Cloud Connected</p>
        </div>
        
        <div class="nav-menu">
            <div class="nav-group-title">Configuration</div>
            <div class="nav-item active" onclick="switchTab('sec-settings', this)">⚙️ Setup & Teams</div>
            
            <!-- SUPER ADMIN ONLY TAB -->
            <div class="nav-item super-admin-only" id="nav-historical" onclick="switchTab('sec-historical', this)">⏳ Historical Data</div>

            <div class="nav-group-title">Scheduling</div>
            <div class="nav-item" id="nav-fixtures" onclick="switchTab('sec-fixtures', this)">📅 Fixture Engine</div>
            
            <div class="nav-group-title">Participants</div>
            <div class="nav-item" id="nav-squads" onclick="switchTab('sec-squads', this)">👥 Roster Verification</div>
            
            <div class="nav-group-title">Launch</div>
            <div class="nav-item" id="nav-deploy" onclick="switchTab('sec-deploy', this)">🚀 Deploy to Cloud</div>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="content-area">
        
        <!-- MOBILE HEADER (Only visible on phones) -->
        <div class="mobile-header">
            <div style="display: flex; align-items: center;">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <h2 id="mobile-app-title" style="margin: 0; color: #3b82f6; font-size: 1.1rem; letter-spacing: 1px; text-transform: uppercase;">Tournament Hub</h2>
            </div>
        </div>

        <!-- MODULE 1: SETUP & TEAMS -->
        <section id="sec-settings" class="hub-section active">
            <div class="admin-form">
                
                <div style="background: rgba(59, 130, 246, 0.1); padding: 15px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #3b82f6; display: flex; gap: 15px; align-items: center; flex-wrap:wrap;">
                    <div style="flex: 1; min-width:200px;">
                        <label style="font-size: 0.8rem; color: #38bdf8; margin-bottom: 5px; font-weight: bold; display:block;">Mode Selection</label>
                        <select id="tournament-mode-select" onchange="toggleTournamentMode(this.value)" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #3b82f6; color: white; border-radius: 6px; outline:none;">
                            <option value="new">➕ Create New Tournament</option>
                            <option value="edit">✏️ Edit Existing Tournament</option>
                        </select>
                    </div>
                    <div id="existing-tournament-wrapper" style="flex: 1; min-width:200px; display: none;">
                        <label id="existing-tournament-label" style="font-size: 0.8rem; color: #f59e0b; margin-bottom: 5px; font-weight: bold; display:block;">Select Tournament to Edit</label>
                        <select id="existing-tournament-select" onchange="loadExistingTournamentData(this.value)" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #f59e0b; color: white; border-radius: 6px; outline:none;">
                            <option value="">Loading tournaments...</option>
                        </select>
                    </div>
                    <div id="tourney-status-badge" style="background: rgba(148, 163, 184, 0.1); padding: 5px 15px; border-radius: 20px; border: 1px solid #94a3b8; color: #94a3b8; font-size: 0.85rem; font-weight: bold;">Unsaved</div>
                </div>

                <h3 style="margin-top: 0; margin-bottom: 15px; color:white; border-bottom: 1px solid #334155; padding-bottom: 10px;">1. Tournament Details & Teams</h3>
                
                <div class="tourney-grid">
                    <div class="card" style="margin:0; height: fit-content;">
                        <div class="input-group">
                            <label>Tournament Name *</label>
                            <input type="text" id="t-name" placeholder="e.g. Veda Premier League">
                        </div>
                        
                        <div class="input-group">
                            <label>Match Tier (Scouting Context) *</label>
                            <select id="t-tier">
                                <option value="Local">Tier 2: Local / Club / Practice</option>
                                <option value="Inter-Division">Tier 1: Inter-Division / Elite</option>
                            </select>
                        </div>
                        
                        <div class="grid-2">
                            <div class="input-group">
                                <label>Format *</label>
                                <select id="t-format">
                                    <option value="T20">T20</option>
                                    <option value="One Day">One Day</option>
                                    <option value="Multi-Day">Multi-Day</option>
                                    <option value="T10">T10</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Starting Date *</label>
                                <input type="date" id="t-date" style="color-scheme: dark;">
                            </div>
                        </div>
                        <div class="input-group" style="margin-bottom:0;">
                            <label>Points System (Per Win)</label>
                            <input type="number" id="tWinPoints" value="2">
                        </div>
                    </div>

                    <div class="card" style="margin:0;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <label style="color:#94a3b8; font-weight:bold; font-size:0.8rem; text-transform:uppercase;">Select Teams</label>
                            <span id="teamCountBadge" style="background:#10b981; color:#020617; padding:3px 8px; border-radius:12px; font-size:0.8rem

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportzstat - Login & Command Portal</title>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 30px 20px; margin: 0;}
        * { box-sizing: border-box; } 
        
        .auth-container { max-width: 420px; margin: 40px auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; font-size: 0.95rem; font-family: inherit; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: #38bdf8; outline: none; }
        .btn-launch { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 0.95rem; transition: 0.2s; }
        .btn-launch:hover { background: #2563eb; }
        .btn-alt { background: transparent; border: 1px dashed #3b82f6; color: #3b82f6; margin-top: 15px; }
        .btn-alt:hover { background: rgba(59, 130, 246, 0.1); }
        
        #portal-dashboard { display: none; max-width: 900px; margin: 0 auto; width: 100%; }
        .portal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .portal-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; text-align: left; text-decoration: none; display: block; color: white; transition: 0.2s ease; cursor: pointer; }
        .portal-card:hover { transform: translateY(-3px); border-color: #3b82f6; background: rgba(59, 130, 246, 0.08); }
        .portal-card h3 { margin: 0 0 8px 0; font-size: 1.1rem; }
        .portal-card p { margin: 0; color: #94a3b8; font-size: 0.85rem; line-height: 1.4; }
        .hidden { display: none !important; }

        /* MATCH HUB WIDGET */
        .match-hub-container { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px; margin-bottom: 25px; text-align: left; }
        .hub-tabs { display: flex; gap: 10px; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px; overflow-x: auto; scrollbar-width: none; }
        .hub-tab { background: transparent; color: #94a3b8; border: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; padding: 5px 10px; white-space: nowrap;}
        .hub-tab.active { color: #f8fafc; border-bottom: 2px solid #3b82f6; }
        
        .carousel-wrapper { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 15px; padding-bottom: 10px; scrollbar-width: none; }
        .carousel-wrapper::-webkit-scrollbar { display: none; }
        
        .hub-card { flex: 0 0 280px; scroll-snap-align: start; background: #0f172a; border: 1px solid #475569; border-radius: 10px; padding: 15px; cursor: pointer; transition: 0.2s; position: relative;}
        .hub-card:hover { border-color: #38bdf8; transform: scale(1.02); }
        .hub-tourney { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .hub-teams { font-size: 1.05rem; font-weight: bold; color: white; margin-bottom: 10px; }
        .hub-badge { position: absolute; top: 12px; right: 12px; font-size: 0.65rem; font-weight: bold; padding: 3px 6px; border-radius: 4px; text-transform: uppercase; }
        .badge-live { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444;}
        .badge-sched { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b;}
        .badge-comp { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981;}

        /* Directory Modal */
        .directory-box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; text-align: left; margin-top: 20px; width: 100%; overflow: hidden; }
        .directory-search { width: 100%; padding: 12px 15px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; font-size: 0.95rem; margin-bottom: 15px; outline: none; }
        .directory-search:focus { border-color: #38bdf8; }

        .table-responsive { width: 100%; overflow-x: auto; scrollbar-width: thin; }
        .directory-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 5px; min-width: 800px; }
        .directory-table th { background: #0f172a; color: #94a3b8; padding: 10px 12px; text-transform: uppercase; font-size: 0.75rem; border-bottom: 1px solid #334155; }
        .directory-table td { padding: 12px; border-bottom: 1px solid #334155; vertical-align: middle; }

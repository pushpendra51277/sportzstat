<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportzstat - Live Match Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
        * { box-sizing: border-box; }
        
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; flex-wrap: wrap; gap: 15px;}
        .login-btn { background: #1e293b; color: #38bdf8; text-decoration: none; padding: 8px 15px; border-radius: 6px; border: 1px solid #334155; font-size: 0.85rem; font-weight: bold; transition: 0.2s; white-space: nowrap; }
        .login-btn:hover { background: #0f172a; color: white; border-color: #38bdf8; }
        
        h1 { color: #38bdf8; margin: 0; font-size: 2rem; display: flex; align-items: center; gap: 10px; letter-spacing: 1px;}
        p.sub { color: #94a3b8; font-size: 0.9rem; border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 20px; margin-top: 5px; }

        .filter-bar { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .filter-select, .search-input { background: #0f172a; color: white; border: 1px solid #475569; padding: 12px 15px; border-radius: 6px; font-size: 0.95rem; flex: 1; min-width: 160px; outline: none; transition: 0.2s; }
        .filter-select:focus, .search-input:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        .search-input { flex: 2; min-width: 250px; }

        .section-title { font-size: 1.2rem; font-weight: bold; margin: 30px 0 15px 0; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        
        .match-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 18px; margin-bottom: 15px; cursor: pointer; transition: 0.2s; position: relative; }
        .match-card:hover { border-color: #38bdf8; background: rgba(30, 41, 59, 0.8); }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .tourney-name { font-size: 0.75rem; color: #94a3b8; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .match-number { background: #334155; color: #f8fafc; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 900; }
        
        .badge { font-size: 0.7rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px;}
        .badge-live { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .badge-comp { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge-up { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .format-badge { background: #0f172a; color: #38bdf8; border: 1px solid #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; }

        .teams { font-size: 1.15rem; font-weight: bold; color: white; margin-bottom: 8px; }
        .score-line { font-size: 1rem; font-weight: bold; color: #10b981; margin-bottom: 10px; }
        .overs { font-size: 0.85rem; color: #94a3b8; font-weight: normal; }
        
        .card-actions-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .tap-details { font-size: 0.85rem; color: #64748b; transition: 0.2s; }
        .match-card:hover .tap-details { color: #38bdf8; }

        .btn-live-panel {
            background: linear-gradient(90deg, #2563eb, #0284c7);
            color: white;
            border: 1px solid #38bdf8;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
            z-index: 5;
            position: relative;
        }
        .btn-live-panel:hover { filter: brightness(1.15); transform: translateY(-1px); }

        .empty-msg { color: #64748b; font-style: italic; font-size: 0.95rem; background: #0f172a; padding: 20px; border-radius: 8px; border: 1px dashed #334155; text-align: center;}
        
        .match-details { display: none; margin-top: 15px; border-top: 1px solid #334155; padding-top: 15px; animation: fadeIn 0.3s ease; cursor: default; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .details-table { width: 100%; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 20px; border-collapse: collapse; }
        .details-table th { color: #94a3b8; border-bottom: 1px solid #334155; padding: 6px 4px; text-align: right; }
        .details-table th:first-child { text-align: left; }
        .details-table td { padding: 6px 4px; border-bottom: 1px solid #1e293b; text-align: right; }
        .details-table td:first-child { text-align: left; }
        
        .meta-box { margin-top: 8px; margin-bottom: 12px; font-size: 0.85rem; line-height: 1.5; background: rgba(0,0,0,0.25); padding: 10px 15px; border-radius: 6px; border-left: 3px solid #38bdf8; }
        .meta-toss { color: #cbd5e1; }
        .meta-result { color: #10b981; font-weight: bold; margin-top: 4px; font-size: 0.9rem; }
        .meta-points { color: #f59e0b; margin-top: 4px; font-weight: bold; }
        .meta-stars { color: #38bdf8; margin-top: 4px; font-weight: bold; }

        .folder-tabs { display: flex; gap: 4px; border-bottom: 1px solid #38bdf8; margin-bottom: 15px; overflow-x: auto; scrollbar-width: none; }
        .folder-tabs::-webkit-scrollbar { display: none; }
        .folder-tab { background: rgba(0,0,0,0.2); border: 1px solid #334155; border-bottom: none; padding: 8px 15px; color: #94a3b8; cursor: pointer; border-radius: 6px 6px 0 0; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; white-space: nowrap; transition: 0.2s; }
        .folder-tab:hover { color: white; background: rgba(56, 189, 248, 0.1); }
        .folder-tab.active { background: #0f172a; color: #38bdf8; border-color: #38bdf8; border-bottom: 2px solid #0f172a; margin-bottom: -1px; }
        .inn-pane { display: none; animation: fadeIn 0.3s ease; }
        .inn-pane.active { display: block; }

        .fan-live-panel-wrap {
            display: none;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #334155;
            cursor: default;
            animation: fadeIn 0.25s ease;
        }
        .fan-recent-balls-box {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 8px 12px;
            min-height: 38px;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: auto;
            white-space: nowrap;
        }
        .ball-badge {
            min-width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #334155;
            font-size: 0.72rem;
            font-weight: bold;
            color: white;
            padding: 0 4px;
            flex-shrink: 0;
        }
        .ball-normal { background: #334155; }
        .ball-four { background: #a855f7; }
        .ball-six { background: #ec4899; }
        .ball-wicket { background: #ef4444; }
        .ball-extra { background: #0891b2; }
        .over-divider { color: #94a3b8; font-weight: bold; font-size: 1rem; margin: 0 3px; flex-shrink: 0; }

        .fan-this-ov-wrap .ball-badge {
            min-width: 18px !important;
            height: 18px !important;
            font-size: 0.6rem !important;
            padding: 0 2px !important;
        }
        .fan-this-ov-wrap .over-divider {
            font-size: 0.8rem !important;
            margin: 0 1px !important;
        }

        .blue-box-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .blue-box-grid { grid-template-columns: 1fr; text-align: center; gap: 10px; }
            .mob-align-left { justify-content: center; margin-bottom: 10px; text-align: center; }
            .mob-align-right { justify-content: center; margin-top: 10px; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>📺 SPORTZSTAT LIVE</h1>
        <a href="login.html" class="login-btn">🔐 DASHBOARD</a>
    </div>
    <p class="sub">Live match center and global scorecards.</p>

    <!-- PRO FILTER BAR -->
    <div class="filter-bar">
        <input type="text" id="fan-search-input" class="search-input" placeholder="🔍 Search Teams or Tournaments..." onkeyup="renderFanMatches()">
        <select id="filter-team" class="filter-select" onchange="renderFanMatches()"><option value="ALL">🛡️ All Teams</option></select>
        <select id="filter-tourney" class="filter-select" onchange="renderFanMatches()"><option value="ALL">🏆 All Tournaments</option></select>
        <select id="filter-format" class="filter-select" onchange="renderFanMatches()"><option value="ALL">🏏 All Formats</option></select>
    </div>

    <!-- QUICK NAVIGATION BUTTONS -->
    <div style="position: sticky; top: 0; z-index: 50; background: #0f172a; padding: 15px 0; margin-bottom: 15px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1e293b;">
        <button onclick="document.getElementById('live-header').scrollIntoView({ behavior: 'smooth' })" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; transition: 0.2s; white-space: nowrap;" onmouseover="this.style.background='#ef4444'; this.style.color='white'" onmouseout="this.style.background='rgba(239, 68, 68, 0.1)'; this.style.color='#ef4444'">🔴 Live Matches ⬇</button>
        <button onclick="document.getElementById('completed-header').scrollIntoView({ behavior: 'smooth' })" style="background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid #10b981; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; transition: 0.2s; white-space: nowrap;" onmouseover="this.style.background='#10b981'; this.style.color='#0f172a'" onmouseout="this.style.background='rgba(16, 185, 129, 0.1)'; this.style.color='#10b981'">✅ Completed Matches ⬇</button>
        <button onclick="document.getElementById('upcoming-header').scrollIntoView({ behavior: 'smooth' })" style="background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid #f59e0b; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; transition: 0.2s; white-space: nowrap;" onmouseover="this.style.background='#f59e0b'; this.style.color='#0f172a'" onmouseout="this.style.background='rgba(245, 158, 11, 0.1)'; this.style.color='#f59e0b'">📅 Upcoming Fixtures ⬇</button>
    </div>

    <!-- SECTIONS -->
    <div id="live-header" class="section-title" style="color: #ef4444; scroll-margin-top: 70px;">🔴 Live Matches</div>
    <div id="live-container"><div class="empty-msg">Fetching live action...</div></div>

    <div id="completed-header" class="section-title" style="color: #10b981; scroll-margin-top: 70px;">✅ Completed Matches</div>
    <div id="comp-container"><div class="empty-msg">Fetching recent results...</div></div>

    <div id="upcoming-header" class="section-title" style="color: #f59e0b; scroll-margin-top: 70px;">📅 Upcoming Fixtures</div>
    <div id="up-container"><div class="empty-msg">Fetching scheduled games...</div></div>

    <script>
        const SUPABASE_URL = "https://cavkoylkbcyhsifrsjyd.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_wklRlSZbzArKFCq31Ugnrw_JWAJkS4K"; 
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allFanMatches = [];
        let expandedMatches = new Set();
        let openLivePanels = new Set();
        let activeTabs = {};

        window.onload = async () => {
            await fetchMatches();
            setInterval(fetchMatches, 10000); 
        };

        function formatOver(balls) {
            let b = Number(balls) || 0;
            return Math.floor(b / 6) + "." + (b % 6);
        }

        function getBadgeHtml(b) {
            if (!b) return '';
            let type = 'normal';
            let lbl = b;
            if (typeof b === 'object') {
                type = b.type || 'normal';
                lbl = b.label;
            } else {
                let s = String(b).toLowerCase();
                if (s === '4') type = 'four';
                else if (s === '6') type = 'six';
                else if (s === 'w' || s === 'wicket') type = 'wicket';
                else if (s === 'wd' || s === 'nb' || s === 'b' || s === 'lb') type = 'extra';
            }
            return type === 'divider' ? '<span class="over-divider">/</span>' : '<div class="ball-badge ball-' + type + '">' + lbl + '</div>';
        }

        function getEffectiveBalls(cur) {
            if (!cur) return 0;
            let effective = 0, prevActual = 0;
            let hist = Array.isArray(cur.overHistory) ? cur.overHistory : [];
            for (let i = 0; i < hist.length; i++) {
                let actualBallsInOver = hist[i].totalBallsAtEnd - prevActual;
                if (hist[i].isPartialTerminal) effective += actualBallsInOver;
                else effective += 6;
                prevActual = hist[i].totalBallsAtEnd;
            }
            let currentOverBalls = Math.max(0, (cur.balls || 0) - prevActual);
            effective += currentOverBalls;
            return effective;
        }

        function getTeamOversDisplay(cur) {
            if (!cur) return "0.0";
            let hist = Array.isArray(cur.overHistory) ? cur.overHistory : [];
            if (hist.length === 0) return formatOver(cur.balls || 0);
            let completedOvers = hist.length;
            let ballsInPreviousOvers = hist[completedOvers - 1].totalBallsAtEnd || (completedOvers * 6);
            let currentOverBalls = Math.max(0, (cur.balls || 0) - ballsInPreviousOvers);
            return completedOvers + "." + currentOverBalls;
        }

        function toggleLivePanel(matchId, event) {
            if (event) event.stopPropagation();
            const panelDiv = document.getElementById('live-panel-' + matchId);
            const btnEl = document.getElementById('btn-live-panel-' + matchId);
            if (!panelDiv) return;

            if (panelDiv.style.display === 'none' || panelDiv.style.display === '') {
                panelDiv.style.display = 'block';
                openLivePanels.add(matchId);
                if (btnEl) btnEl.innerHTML = '📺 Hide Live Scoreboard ▲';
            } else {
                panelDiv.style.display = 'none';
                openLivePanels.delete(matchId);
                if (btnEl) btnEl.innerHTML = '📺 Open Live Scoreboard ▼';
            }
        }

        function toggleDetails(matchId, event) {
            const detailsDiv = document.getElementById('details-' + matchId);
            if (!detailsDiv) return;
            if (detailsDiv.style.display === 'none' || detailsDiv.style.display === '') {
                detailsDiv.style.display = 'block';
                expandedMatches.add(matchId);
            } else {
                detailsDiv.style.display = 'none';
                expandedMatches.delete(matchId);
            }
        }

        window.switchFolder = function(matchId, targetIdx, totalInn, event) {
            event.stopPropagation();
            activeTabs[matchId] = targetIdx;
            for(let i=0; i<totalInn; i++) {
                let tab = document.getElementById('tab-' + matchId + '-' + i);
                let pane = document.getElementById('pane-' + matchId + '-' + i);
                if(tab) tab.classList.remove('active');
                if(pane) { pane.classList.remove('active'); pane.style.display = 'none'; }
            }
            let actTab = document.getElementById('tab-' + matchId + '-' + targetIdx);
            let actPane = document.getElementById('pane-' + matchId + '-' + targetIdx);
            if(actTab) actTab.classList.add('active');
            if(actPane) { actPane.classList.add('active'); actPane.style.display = 'block'; }
        };

        async function fetchMatches() {
            const [matchesRes, liveRes] = await Promise.all([
                db.from('matches').select('match_id, full_state, tournaments(name)').order('created_at', { ascending: false }),
                db.from('live_matches').select('*')
            ]);

            if (matchesRes.error) { console.error("Cloud Error:", matchesRes.error); return; }
            
            let liveMap = new Map();
            if (liveRes.data) {
                liveRes.data.forEach(l => liveMap.set(l.match_id, l.live_data));
            }
            
            allFanMatches = (matchesRes.data || []).filter(m => !m.match_id || !m.match_id.startsWith('HIST-'));
            let filterSets = { teams: new Set(), tourneys: new Set(), formats: new Set() };
            
            allFanMatches.forEach(m => {
                let fs = typeof m.full_state === 'string' ? JSON.parse(m.full_state) : (m.full_state || {});
                let liveData = typeof liveMap.get(m.match_id) === 'string' ? JSON.parse(liveMap.get(m.match_id)) : liveMap.get(m.match_id);
                if (liveData) m.live_data = liveData;

                let t1 = fs.team1 || (fs.teams && fs.teams.A && fs.teams.A.name);
                let t2 = fs.team2 || (fs.teams && fs.teams.B && fs.teams.B.name);
                let tourney = (m.tournaments && m.tournaments.name) ? m.tournaments.name : fs.tournament;
                let format = fs.format || 'T20';

                if (t1) filterSets.teams.add(t1);
                if (t2) filterSets.teams.add(t2);
                if (tourney) filterSets.tourneys.add(tourney);
                if (format) filterSets.formats.add(format);
                m.computedFormat = format;
            });

            let updateDropdown = (id, set, defaultText) => { 
                let el = document.getElementById(id); 
                let currentVal = el.value;
                el.innerHTML = '<option value="ALL">' + defaultText + '</option>';
                Array.from(set).sort().forEach(v => el.innerHTML += '<option value="' + v + '">' + v + '</option>'); 
                if (Array.from(set).includes(currentVal)) el.value = currentVal;
            };

            updateDropdown('filter-team', filterSets.teams, '🛡️ All Teams');
            updateDropdown('filter-tourney', filterSets.tourneys, '🏆 All Tournaments');
            updateDropdown('filter-format', filterSets.formats, '🏏 All Formats');

            renderFanMatches();
        }

        function renderFanMatches() {
            const query = document.getElementById('fan-search-input').value.toLowerCase().trim();
            const fTeam = document.getElementById('filter-team').value;
            const fTourn = document.getElementById('filter-tourney').value;
            const fForm = document.getElementById('filter-format').value;
            
            let liveHtml = '', compHtml = '', upHtml = '';
            let liveCnt = 1, compCnt = 1, upCnt = 1;

            allFanMatches.forEach(m => {
                let fs = typeof m.full_state === 'string' ? JSON.parse(m.full_state) : (m.full_state || {});
                let ld = typeof m.live_data === 'string' ? JSON.parse(m.live_data) : (m.live_data || {});
                
                let t1 = fs.team1 || (fs.teams && fs.teams.A && fs.teams.A.name) || 'Team 1';
                let t2 = fs.team2 || (fs.teams && fs.teams.B && fs.teams.B.name) || 'Team 2';
                let tourney = (m.tournaments && m.tournaments.name) ? m.tournaments.name : (fs.tournament || 'Independent Match');
                let format = m.computedFormat;

                let status = (fs.match_status || 'upcoming').toLowerCase();
                let fps = ld.fan_portal_summary || fs.fan_portal_summary || {};
                
                if ((fs.matchResult && fs.matchResult.trim() !== '') || (fps.result && fps.result !== 'Match in Progress' && fps.result !== '')) {
                    status = 'completed';
                } else if (ld.runs !== undefined || ld.batTeam) {
                    status = 'live';
                }

                if (fTeam !== 'ALL' && t1 !== fTeam && t2 !== fTeam) return;
                if (fTourn !== 'ALL' && tourney !== fTourn) return;
                if (fForm !== 'ALL' && format !== fForm) return;
                
                let searchStr = (t1 + " " + t2 + " " + tourney).toLowerCase();
                if (query && !searchStr.includes(query)) return; 

                let fallbackOvers = getTeamOversDisplay(fs.current);
                let oversVal = ld.overs || fallbackOvers;
                let oParts = String(oversVal).split('.');
                let liveBalls = (parseInt(oParts[0]) * 6) + (parseInt(oParts[1] || 0));

                let scoreText = '';
                if (status === 'live' || status === 'completed') {
                    let batTeam = ld.batTeam || (fs.teams && fs.teams[fs.battingKey] && fs.teams[fs.battingKey].name) || t1;
                    let runs = ld.runs !== undefined ? ld.runs : (fs.current && fs.current.runs !== undefined ? fs.current.runs : 0);
                    let wkts = ld.wkts !== undefined ? ld.wkts : (fs.current && fs.current.wkts !== undefined ? fs.current.wkts : 0);
                    let scoreColor = status === 'completed' ? 'color:#38bdf8;' : '';
                    scoreText = '<div class="score-line" style="' + scoreColor + '">' + batTeam + ': ' + runs + '/' + wkts + ' <span class="overs">(' + oversVal + ' ov)</span></div>';
                }

                let tossStr = fps.toss && fps.toss !== "Toss not recorded" ? '🪙 ' + fps.toss : '';
                let resultStr = '';
                let pointsStr = '';
                let starsStr = '';

                if (fps.top_batters && fps.top_batters.length > 0 && fps.top_batters[0].name) {
                    let bestBat = fps.top_batters[0];
                    let bestBowl = fps.top_bowlers && fps.top_bowlers.length > 0 ? fps.top_bowlers[0] : null;
                    starsStr = '🌟 Key Performers: ' + bestBat.name + ' (' + bestBat.runs + 'r)';
                    if (bestBowl && bestBowl.name) starsStr += ' & ' + bestBowl.name + ' (' + bestBowl.wkts + 'w)';
                }

                if (status === 'completed') {
                    if (fps.result && fps.result !== "Match in Progress") resultStr = '🏆 ' + fps.result;
                    if (fps.team_points) {
                        let ptsArr = [];
                        for (const key in fps.team_points) { ptsArr.push(key + ':' + fps.team_points[key]); }
                        if (ptsArr.length > 0) pointsStr = '📊 Points: ' + ptsArr.join(' | ');
                    }
                }

                let metaHtml = '';
                if (tossStr || resultStr || pointsStr || starsStr) {
                    metaHtml += '<div class="meta-box">';
                    if (tossStr) metaHtml += '<div class="meta-toss">' + tossStr + '</div>';
                    if (resultStr) metaHtml += '<div class="meta-result">' + resultStr + '</div>';
                    if (pointsStr) metaHtml += '<div class="meta-points">' + pointsStr + '</div>';
                    if (starsStr) metaHtml += '<div class="meta-stars">' + starsStr + '</div>';
                    metaHtml += '</div>';
                }

                let isOpen = openLivePanels.has(m.match_id);
                let livePanelBtnHtml = '';
                let livePanelHtml = '';
                
                if (status === 'live') {
                    livePanelBtnHtml = '<button type="button" class="btn-live-panel" id="btn-live-panel-' + m.match_id + '" onclick="toggleLivePanel(\'' + m.match_id + '\', event)">' + (isOpen ? '📺 Hide Live Scoreboard ▲' : '📺 Open Live Scoreboard ▼') + '</button>';
                    
                    let batTeamName = ld.batTeam || t1;
                    let runsVal = ld.runs !== undefined ? ld.runs : (fs.current && fs.current.runs !== undefined ? fs.current.runs : 0);
                    let wktsVal = ld.wkts !== undefined ? ld.wkts : (fs.current && fs.current.wkts !== undefined ? fs.current.wkts : 0);
                    let crrVal = ld.crr || "0.00";
                    
                    // 🔥 SAFELY BUILD BATTERS
                    let battersHtml = '';
                    let activeBatters = [];
                    
                    if (fs.teams && fs.battingKey && fs.teams[fs.battingKey].players) {
                        let pList = fs.teams[fs.battingKey].players;
                        if (fs.current && fs.current.sIdx !== null && pList[fs.current.sIdx]) {
                            activeBatters.push({ name: pList[fs.current.sIdx].name, r: pList[fs.current.sIdx].r, b: pList[fs.current.sIdx].b, isStriker: true });
                        }
                        if (fs.current && fs.current.nsIdx !== null && pList[fs.current.nsIdx]) {
                            activeBatters.push({ name: pList[fs.current.nsIdx].name, r: pList[fs.current.nsIdx].r, b: pList[fs.current.nsIdx].b, isStriker: false });
                        }
                        if (activeBatters.length === 0) {
                            let notOuts = pList.filter(p => p.hasBatted && !p.out && p.out !== 'out' && p.dismissalInfo !== 'Retired Out');
                            notOuts.forEach((p, idx) => {
                                if (idx < 2) activeBatters.push({ name: p.name, r: p.r, b: p.b, isStriker: (idx === 0) });
                            });
                        }
                    }
                    if (activeBatters.length === 0 && Array.isArray(ld.batters)) {
                        ld.batters.forEach(b => { if (b && b.name) activeBatters.push(b); });
                    }

                    if (activeBatters.length > 0) {
                        activeBatters.forEach(b => {
                            let isStr = b.isStriker ? '<span style="color:#f472b6; font-size:0.75rem; margin-right:4px;">🏏</span>' : '';
                            let nameColor = b.isStriker ? 'white' : '#cbd5e1';
                            let runColor = b.isStriker ? '#38bdf8' : '#94a3b8';
                            let rVal = b.r !== undefined ? b.r : 0;
                            let bVal = b.b !== undefined ? b.b : 0;
                            battersHtml += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">' +
                                           '<div style="color:' + nameColor + '; font-weight:bold; font-size:0.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:130px;">' + b.name + '</div>' +
                                           '<div style="white-space:nowrap; text-align:right;">' + isStr + '<span style="color:' + runColor + '; font-weight:bold; font-size:1.1rem;">' + rVal + '</span>' +
                                           '<span style="color:#64748b; font-size:0.8rem; margin-left:4px;">(' + bVal + ')</span></div></div>';
                        });
                    } else {
                        battersHtml = '<div style="color:#64748b; font-style:italic; font-size:0.85rem;">Waiting for batter...</div>';
                    }

                    // 🔥 SAFELY BUILD BOWLER
                    let bowlerHtml = '';
                    let activeBowlerObj = null;
                    
                    if (fs.teams && fs.bowlingKey && fs.teams[fs.bowlingKey].players) {
                        let bList = fs.teams[fs.bowlingKey].players;
                        if (fs.current && fs.current.bIdx !== null && bList[fs.current.bIdx]) {
                            let bw = bList[fs.current.bIdx];
                            activeBowlerObj = { name: bw.name, o: formatOver(bw.o), m: bw.m || 0, r: bw.rc || 0, w: bw.w || 0 };
                        } else {
                            let sortedBowlers = bList.filter(p => p.o > 0 || p.rc > 0).sort((a,b) => b.o - a.o);
                            if (sortedBowlers.length > 0) {
                                let bw = sortedBowlers[0];
                                activeBowlerObj = { name: bw.name, o: formatOver(bw.o), m: bw.m || 0, r: bw.rc || 0, w: bw.w || 0 };
                            }
                        }
                    }
                    if (!activeBowlerObj && ld.bowler && ld.bowler.name) {
                        activeBowlerObj = { name: ld.bowler.name, o: ld.bowler.o, m: ld.bowler.m || 0, r: ld.bowler.r || 0, w: ld.bowler.w || 0 };
                    }

                    if (activeBowlerObj) {
                        bowlerHtml = '<div style="text-align:right;">' +
                                     '<div style="color:white; font-weight:bold; font-size:0.95rem; margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px;">⚾ ' + activeBowlerObj.name + '</div>' +
                                     '<div style="color:#94a3b8; font-size:0.85rem;">' + activeBowlerObj.o + '-' + activeBowlerObj.m + '-' + activeBowlerObj.r + '-<span style="color:#ef4444; font-weight:bold;">' + activeBowlerObj.w + '</span></div>' +
                                     '</div>';
                    } else {
                        bowlerHtml = '<div style="color:#64748b; font-style:italic; font-size:0.85rem; text-align:right;">Waiting for bowler...</div>';
                    }

                    // 🔥 MATH & TARGET
                    let targetHtml = '';
                    let reqHtml = '';
                    let rrrHtml = '';
                    
                    let targetTxt = ld.target || "";
                    let currentInningsNumber = fs.inningsNum || 1;
                    if (fps.innings && Array.isArray(fps.innings) && fps.innings.length > currentInningsNumber) {
                        currentInningsNumber = fps.innings.length; 
                    }

                    let tRuns = 0;
                    if (currentInningsNumber > 1 && fps.innings && fps.innings.length > 0) {
                        let prevScoreStr = fps.innings[0].score || "0/0";
                        tRuns = parseInt(prevScoreStr.split('/')[0], 10) + 1;
                        if (fs.matchSettings && fs.matchSettings.customTarget) tRuns = fs.matchSettings.customTarget;

                        if (tRuns > 0) {
                            let runsNeeded = tRuns - runsVal;
                            if (runsNeeded < 0) runsNeeded = 0;
                            
                            let tOvers = (fs.matchSettings && fs.matchSettings.customTargetOvers) ? fs.matchSettings.customTargetOvers : ((fs.matchSettings && fs.matchSettings.maxOvers) ? fs.matchSettings.maxOvers : 20);
                            let targetFullOvers = Math.floor(tOvers);
                            let targetExtraBalls = Math.round((tOvers - targetFullOvers) * 10);
                            let totalTargetBalls = (targetFullOvers * 6) + targetExtraBalls;
                            
                            let ballsLeft = totalTargetBalls - liveBalls;
                            if (ballsLeft < 0) ballsLeft = 0;
                            
                            let rrrCalc = ballsLeft > 0 ? ((runsNeeded / ballsLeft) * 6).toFixed(2) : "0.00";
                            let runsColor = runsNeeded <= ballsLeft ? '#10b981' : '#ef4444';
                            
                            targetHtml = '<div style="text-align:center; margin-bottom:12px;"><div style="display:inline-block; border:1px solid #38bdf8; background:rgba(56,189,248,0.15); color:#38bdf8; padding:4px 12px; border-radius:20px; font-size:0.85rem; font-weight:bold;">🎯 Target: ' + tRuns + ' (' + tOvers + ' ov)</div></div>';
                            reqHtml = '<span style="color:#94a3b8; font-size:0.95rem; margin-left:12px;">| Req: <b style="color:' + runsColor + ';">' + runsNeeded + '</b>/<b style="color:#38bdf8;">' + ballsLeft + '</b></span>';
                            rrrHtml = '<span style="color:#94a3b8; font-size:0.95rem; margin-left:12px;">| RRR: <b style="color:#f59e0b;">' + rrrCalc + '</b></span>';
                        }
                    } else if (targetTxt && targetTxt.trim() !== '') {
                        targetHtml = '<div style="text-align:center; margin-bottom:12px;"><div style="display:inline-block; border:1px solid #38bdf8; background:rgba(56,189,248,0.15); color:#38bdf8; padding:4px 12px; border-radius:20px; font-size:0.85rem; font-weight:bold;">🎯 ' + targetTxt + '</div></div>';
                    }

                    let recentBadges = Array.isArray(ld.recentBalls) ? ld.recentBalls.map(getBadgeHtml).join('') : '';
                    let pshipRuns = (fs.current && fs.current.currPartnership) ? fs.current.currPartnership.runs : 0;
                    let pshipBalls = (fs.current && fs.current.currPartnership) ? fs.current.currPartnership.balls : 0;
                    let pshipText = pshipRuns + ' (' + pshipBalls + ')';
                    let thisOverBadges = (fs.current && Array.isArray(fs.current.currentOverLog)) ? fs.current.currentOverLog.map(getBadgeHtml).join('') : '';

                    let ex = (fs.current && fs.current.extras) ? fs.current.extras : { w: 0, nb: 0, b: 0, lb: 0 };
                    let exW = ex.w ? ex.w : 0; let exNB = ex.nb ? ex.nb : 0; let exB = ex.b ? ex.b : 0; let exLB = ex.lb ? ex.lb : 0;
                    let exTotal = exW + exNB + exB + exLB;
                    let pen = (fs.current && fs.current.penalties) ? fs.current.penalties : 0;
                    let extrasHtml = '<div style="font-size:0.8rem; color:#64748b; margin-top:8px;">Extras: ' + exTotal + ' (W:' + exW + ', NB:' + exNB + ', B:' + exB + ', LB:' + exLB + ') <span style="color:#f59e0b; margin-left:5px;">| PEN: ' + pen + '</span></div>';

                    // THE FINAL INDESTRUCTIBLE BLUE BOX
                    livePanelHtml = '<div class="fan-live-panel-wrap" id="live-panel-' + m.match_id + '" ' + (isOpen ? 'style="display: block;"' : '') + ' onclick="event.stopPropagation()">' +
                        '<div style="border: 2px solid #3b82f6; border-radius: 12px; background: #020617; padding: 15px; position: relative; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);">' +
                            '<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:5px;">' +
                                '<div><span style="background:#ef4444; color:white; padding:4px 8px; border-radius:4px; font-size:0.75rem; font-weight:900; letter-spacing:0.5px;">INNINGS ' + currentInningsNumber + '</span></div>' +
                                '<div style="text-align:center; flex:1;">' +
                                    '<div style="color:#3b82f6; font-weight:bold; font-size:1.1rem; text-transform:uppercase;">' + tourney + '</div>' +
                                    '<div style="color:#cbd5e1; font-size:0.85rem; margin-top:3px;">📍 Batting: <span style="color:#f59e0b; font-weight:bold;">' + batTeamName + '</span></div>' +
                                '</div>' +
                                '<div style="min-width:70px;"></div>' +
                            '</div>' +
                            targetHtml +
                            '<div class="blue-box-grid">' +
                                '<div class="mob-align-left" style="text-align:left;">' + battersHtml + '</div>' +
                                '<div style="text-align:center;">' +
                                    '<div style="display:flex; justify-content:center; align-items:baseline; gap:5px; line-height:1;">' +
                                        '<span style="font-size:3.5rem; font-weight:900; color:#f59e0b;">' + runsVal + '</span>' +
                                        '<span style="font-size:2.5rem; font-weight:900; color:#f59e0b;">/</span>' +
                                        '<span style="font-size:3.5rem; font-weight:900; color:#ef4444;">' + wktsVal + '</span>' +
                                    '</div>' +
                                '</div>' +
                                '<div class="mob-align-right" style="text-align:right;">' + bowlerHtml + '</div>' +
                            '</div>' +
                            '<div style="text-align:center; border-bottom:1px dashed #1e293b; padding-bottom:15px; margin-bottom:15px;">' +
                                '<div style="display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:8px;">' +
                                    '<span style="font-size:1.4rem; color:white;">Overs: <b style="font-weight:900;">' + oversVal + '</b></span>' +
                                    '<span style="font-size:1rem; color:#94a3b8; margin-left:10px;">CRR: <b style="color:white;">' + crrVal + '</b></span>' +
                                    reqHtml + rrrHtml +
                                '</div>' +
                                extrasHtml +
                            '</div>' +
                            '<div style="display:flex; justify-content:center; align-items:center; gap:20px; flex-wrap:wrap;">' +
                                '<div style="color:#10b981; font-weight:bold; font-size:0.95rem;">🏏 P\'ship: ' + pshipText + '</div>' +
                                '<div class="fan-this-ov-wrap" style="display:flex; align-items:center; gap:6px; background:#0f172a; border:1px solid #334155; padding:6px 14px; border-radius:20px;">' +
                                    '<span style="font-size:0.75rem; color:#94a3b8; font-weight:bold;">THIS OV:</span>' +
                                    '<div style="display:flex; gap:4px; align-items:center;">' + thisOverBadges + '</div>' +
                                '</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="fan-recent-balls-box" style="margin-top:10px;">' +
                            '<span style="font-size:0.7rem; text-transform:uppercase; color:#94a3b8; font-weight:bold; flex-shrink:0;">RECENT:</span>' +
                            '<div style="display:flex; align-items:center; gap:6px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;">' + recentBadges + '</div>' +
                        '</div>' +
                    '</div>';
                }

                let isExpanded = expandedMatches.has(m.match_id) ? 'style="display: block;"' : '';
                let detailsHtml = '<div class="match-details" id="details-' + m.match_id + '" ' + isExpanded + ' onclick="event.stopPropagation()">';
                
                let innMap = new Map();
                if (Array.isArray(fs.inningsSummaries)) {
                    fs.inningsSummaries.forEach((inn, idx) => {
                        let key = inn.innNum || (idx + 1);
                        innMap.set(key, { ...inn, innNum: key });
                    });
                }
                
                let currentInnNum = fs.inningsNum || (innMap.size + 1);
                if (status === 'live' && fs.current && (fs.current.balls > 0 || fs.current.runs > 0) && !innMap.has(currentInnNum)) {
                    innMap.set(currentInnNum, {
                        innNum: currentInnNum,
                        batTeam: fs.teams[fs.battingKey].name,
                        batters: fs.teams[fs.battingKey].players,
                        bowlers: fs.teams[fs.bowlingKey].players,
                        extras: fs.current.extras || { w: 0, nb: 0, b: 0, lb: 0 },
                        penalties: fs.current.penalties || 0,
                        fow: fs.current.fow || [],
                        isOngoing: true
                    });
                }

                let displayInnings = Array.from(innMap.values()).sort((a, b) => a.innNum - b.innNum);

                if (displayInnings.length > 0) {
                    let tabsHtml = '<div class="folder-tabs">';
                    let panesHtml = '';
                    
                    let savedTabIdx = activeTabs[m.match_id] !== undefined ? activeTabs[m.match_id] : (displayInnings.length - 1);
                    if (savedTabIdx >= displayInnings.length) savedTabIdx = displayInnings.length - 1;

                    displayInnings.forEach((inn, idx) => {
                        let isAct = (idx === savedTabIdx) ? 'active' : ''; 
                        let dState = (idx === savedTabIdx) ? 'block' : 'none';
                        let iLabel = 'Inn ' + (inn.innNum || (idx+1)) + ': ' + inn.batTeam;
                        if (inn.isOngoing) iLabel += ' (LIVE)';

                        tabsHtml += '<div class="folder-tab ' + isAct + '" id="tab-' + m.match_id + '-' + idx + '" onclick="switchFolder(\'' + m.match_id + '\', ' + idx + ', ' + displayInnings.length + ', event)">' + iLabel + '</div>';
                        panesHtml += '<div class="inn-pane ' + isAct + '" id="pane-' + m.match_id + '-' + idx + '" style="display:' + dState + ';">';
                        
                        panesHtml += '<table class="details-table" style="margin-bottom: 15px;"><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>';
                        (inn.batters || []).filter(b => b.hasBatted).forEach(b => {
                            let sr = b.b > 0 ? ((b.r/b.b)*100).toFixed(1) : '0.0';
                            let outStr = b.out ? (b.dismissalInfo || 'out') : 'not out';
                            panesHtml += '<tr>' +
                                '<td><span style="font-weight:bold; color:white;">' + b.name + '</span><div style="font-size:0.65rem; color:#64748b;">' + outStr + '</div></td>' +
                                '<td style="font-weight:bold; color:white;">' + b.r + '</td><td>' + b.b + '</td><td>' + b.f + '</td><td>' + b.s + '</td><td>' + sr + '</td>' +
                            '</tr>';
                        });

                        let innEx = inn.extras || { w: 0, nb: 0, b: 0, lb: 0 };
                        let innExTotal = (innEx.w || 0) + (innEx.nb || 0) + (innEx.b || 0) + (innEx.lb || 0);
                        panesHtml += '<tr style="background:rgba(255,255,255,0.03);"><td style="color:#f59e0b; font-weight:bold;">Extras</td><td colspan="5" style="color:white; font-weight:bold;">' + innExTotal + ' <span style="font-weight:normal; color:#94a3b8; font-size:0.7rem;">(W:' + (innEx.w||0) + ', NB:' + (innEx.nb||0) + ', B:' + (innEx.b||0) + ', LB:' + (innEx.lb||0) + ')</span></td></tr>';
                        panesHtml += '</table>';

                        panesHtml += '<table class="details-table" style="margin-bottom: 12px;"><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th></tr>';
                        (inn.bowlers || []).filter(bw => bw.o > 0 || bw.rc > 0).forEach(bw => {
                            let oVal = Number(bw.o) || 0;
                            let oversStr = "", absBalls = 0;
                            if (oVal % 1 !== 0) {
                                oversStr = Math.floor(oVal) + "." + Math.round((oVal - Math.floor(oVal)) * 10);
                                absBalls = Math.floor(oVal) * 6 + Math.round((oVal - Math.floor(oVal)) * 10);
                            } else {
                                oversStr = Math.floor(oVal / 6) + "." + (oVal % 6);
                                absBalls = oVal;
                            }
                            let econ = absBalls > 0 ? ((bw.rc/absBalls)*6).toFixed(2) : '0.00';
                            panesHtml += '<tr>' +
                                '<td><span style="font-weight:bold; color:white;">' + bw.name + '</span></td>' +
                                '<td>' + oversStr + '</td><td>' + bw.m + '</td><td>' + bw.rc + '</td><td style="font-weight:bold; color:#10b981;">' + bw.w + '</td><td>' + econ + '</td>' +
                            '</tr>';
                        });
                        panesHtml += '</table>';

                        if (inn.fow && inn.fow.length > 0) {
                            let fowItems = inn.fow.map(f => '<b style="color:white;">' + f.runs + '/' + (f.wktNum === 'Unbroken' ? '*' : f.wktNum) + '</b> <span style="color:#94a3b8;">(' + f.outBatter + ', ' + f.overs + ' ov)</span>').join(' &bull; ');
                            panesHtml += '<div style="font-size:0.75rem; background:rgba(0,0,0,0.25); padding:8px 10px; border-radius:6px; border-left:3px solid #f59e0b; line-height:1.5;"><b style="color:#f59e0b;">Fall of Wickets:</b> ' + fowItems + '</div>';
                        }

                        panesHtml += '</div>';
                    });

                    tabsHtml += '</div>'; 
                    detailsHtml += tabsHtml + panesHtml;
                } else {
                    detailsHtml += '<div style="color:#64748b; font-style:italic; text-align:center; padding: 10px;">Scorecard details will appear once the match begins.</div>';
                }
                detailsHtml += '</div>';

                let createCard = (num, badgeClass, badgeText) => '<div class="match-card" onclick="toggleDetails(\'' + m.match_id + '\', event)">' +
                        '<div class="card-header">' +
                            '<div class="tourney-name"><span class="match-number">#' + num + '</span> ' + tourney + ' <span class="format-badge">' + format + '</span></div>' +
                            '<div class="badge ' + badgeClass + '">● ' + badgeText + '</div>' +
                        '</div>' +
                        '<div class="teams">' + t1 + ' <span style="color:#64748b; font-size:0.85em; font-weight:normal; margin: 0 5px;">vs</span> ' + t2 + '</div>' +
                        scoreText +
                        metaHtml +
                        '<div class="card-actions-row">' +
                            '<div class="tap-details">📋 Tap card for full scorecard ↓</div>' +
                            livePanelBtnHtml +
                        '</div>' +
                        livePanelHtml +
                        detailsHtml +
                    '</div>';

                if (status === 'live' || status === 'innings_break') { liveHtml += createCard(liveCnt++, 'badge-live', 'LIVE'); }
                else if (status === 'completed') { compHtml += createCard(compCnt++, 'badge-comp', 'COMPLETED'); }
                else { upHtml += createCard(upCnt++, 'badge-up', 'UPCOMING'); }
            });

            document.getElementById('live-container').innerHTML = liveHtml || '<div class="empty-msg">No active matches matching your criteria.</div>';
            document.getElementById('comp-container').innerHTML = compHtml || '<div class="empty-msg">No completed matches matching your criteria.</div>';
            document.getElementById('up-container').innerHTML = upHtml || '<div class="empty-msg">No upcoming fixtures matching your criteria.</div>';
        }
    </script>
</body>
</html>

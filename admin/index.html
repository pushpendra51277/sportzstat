<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportzstat - Match Creator</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background-color: #020617; color: white; font-family: sans-serif; padding: 20px;">

<div style="max-width: 900px; margin: 0 auto; background: #0f172a; padding: 30px; border-radius: 12px; border: 1px solid #334155;">
    <h1 style="color: #38bdf8; text-align: center; margin-top: 0;">🛠️ Admin Match & Squad Creator</h1>
    <p style="text-align: center; color: #94a3b8;">Link Teams, map Tournament Squads, and generate an Official Match ID.</p>

    <!-- STEP 1: Select Event -->
    <div style="background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #475569;">
        <h3 style="margin-top: 0; color: #10b981;">1. Select Event</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
            <div>
                <label style="display:block; color:#94a3b8; font-size:0.85rem; margin-bottom:5px;">Tournament</label>
                <select id="selTournament" style="width:100%; padding:10px; background:#020617; color:white; border:1px solid #334155; border-radius:4px;"></select>
            </div>
            <div>
                <label style="display:block; color:#94a3b8; font-size:0.85rem; margin-bottom:5px;">Team A</label>
                <select id="selTeamA" style="width:100%; padding:10px; background:#020617; color:white; border:1px solid #334155; border-radius:4px;"></select>
            </div>
            <div>
                <label style="display:block; color:#94a3b8; font-size:0.85rem; margin-bottom:5px;">Team B</label>
                <select id="selTeamB" style="width:100%; padding:10px; background:#020617; color:white; border:1px solid #334155; border-radius:4px;"></select>
            </div>
        </div>
        <button type="button" onclick="loadRosters()" style="width: 100%; padding: 12px; margin-top: 15px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Fetch Master Rosters</button>
    </div>

    <!-- STEP 2: Map Squads -->
    <div id="rosterSelectionBox" class="hidden" style="background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #475569;">
        <h3 style="margin-top: 0; color: #f59e0b;">2. Map Tournament Squads</h3>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-top:0;">Select the players from the master roster who will be available for this specific match/tournament.</p>
        
        <div style="display: flex; gap: 20px;">
            <div style="flex: 1; background: #020617; padding: 15px; border-radius: 6px; border: 1px solid #334155;">
                <h4 id="labelTeamA" style="margin-top: 0; color: #cbd5e1; border-bottom: 1px solid #334155; padding-bottom: 5px;">Team A</h4>
                <div id="listTeamA" style="display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto;"></div>
            </div>
            <div style="flex: 1; background: #020617; padding: 15px; border-radius: 6px; border: 1px solid #334155;">
                <h4 id="labelTeamB" style="margin-top: 0; color: #cbd5e1; border-bottom: 1px solid #334155; padding-bottom: 5px;">Team B</h4>
                <div id="listTeamB" style="display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <!-- STEP 3: Create Match -->
    <div id="matchCreationBox" class="hidden" style="background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #475569;">
        <h3 style="margin-top: 0; color: #ec4899;">3. Finalize & Generate Match</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div>
                <label style="display:block; color:#94a3b8; font-size:0.85rem; margin-bottom:5px;">Scorer PIN (For Gateway Login)</label>
                <input type="text" id="matchPin" value="1234" style="width:100%; padding:10px; background:#020617; color:white; border:1px solid #334155; border-radius:4px; font-weight:bold;">
            </div>
            <div>
                <label style="display:block; color:#94a3b8; font-size:0.85rem; margin-bottom:5px;">Venue / Ground</label>
                <input type="text" id="matchVenue" placeholder="e.g. Captain Roop Singh Stadium" style="width:100%; padding:10px; background:#020617; color:white; border:1px solid #334155; border-radius:4px;">
            </div>
        </div>
        <button type="button" onclick="createMatch()" style="width: 100%; padding: 15px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1.1rem; cursor: pointer;">✅ Create Match & Inject Database</button>
    </div>

    <div id="statusMessage" style="margin-top: 20px; text-align: center; font-weight: bold; font-size: 1.1rem;"></div>

</div>

<script src="admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportzstat - Live Scorer</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #020617; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        .auth-box { background: #0f172a; padding: 30px; border-radius: 12px; border: 1px solid #334155; max-width: 400px; margin: 50px auto; }
        .input-dark { width: 100%; padding: 15px; background: #020617; color: white; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; font-size: 1.2rem; text-align: center; letter-spacing: 2px; }
        .btn-green { background: #10b981; color: white; border: none; padding: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.2rem; }
        .hidden { display: none; }
        
        .setup-box { background: #0f172a; padding: 25px; border-radius: 12px; border: 1px solid #3b82f6; max-width: 900px; margin: 20px auto; text-align: left; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .squad-list { background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; max-height: 400px; overflow-y: auto; }
        .player-row { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #334155; cursor: pointer; }
        .player-row:hover { background: #334155; }
        .counter-badge { background: #38bdf8; color: #020617; padding: 3px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; margin-left: 10px; vertical-align: middle; }
    </style>
</head>
<body>

    <h2 style="color: #10b981; letter-spacing: 2px;">OFFICIAL SCORER PORTAL</h2>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="auth-box">
        <h3 style="margin-top: 0; color: #38bdf8;">Match Authentication</h3>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px;">Enter the Match ID and PIN provided by the Tournament Admin.</p>
        
        <label style="display: block; text-align: left; color: #cbd5e1; font-size: 0.85rem; margin-bottom: 5px; font-weight:bold;">Match ID</label>
        <input type="text" id="login-match-id" class="input-dark" placeholder="e.g. M-A1B2C" style="text-transform: uppercase;">
        
        <label style="display: block; text-align: left; color: #cbd5e1; font-size: 0.85rem; margin-bottom: 5px; font-weight:bold;">Scorer PIN</label>
        <input type="password" id="login-pin" class="input-dark" placeholder="****">
        
        <button type="button" class="btn-green" onclick="authenticateMatch()">Unlock Match</button>
        <div id="login-error" style="color: #ef4444; margin-top: 15px; font-weight: bold;"></div>
    </div>

    <!-- PLAYING XI SELECTION SCREEN -->
    <div id="toss-screen" class="setup-box hidden">
        <h3 style="border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top:0; color:#38bdf8;">Toss & Playing XI Selection</h3>
        <p style="color: #94a3b8; font-size: 0.9rem;">Select the exact players (Playing XI + Substitutes) walking onto the field today.</p>
        
        <div class="grid-2">
            <div>
                <h4 id="team-a-name" style="color: #f59e0b; text-align: center;">Team A <span id="count-team-a-squad" class="counter-badge">0 Selected</span></h4>
                <div id="team-a-squad" class="squad-list">Loading...</div>
            </div>
            <div>
                <h4 id="team-b-name" style="color: #f59e0b; text-align: center;">Team B <span id="count-team-b-squad" class="counter-badge">0 Selected</span></h4>
                <div id="team-b-squad" class="squad-list">Loading...</div>
            </div>
        </div>

        <button type="button" class="btn-green" style="margin-top: 25px;" onclick="lockPlayingXI()">Lock Playing XI & Start Match</button>
    </div>

    <script>
        const SUPABASE_URL = "https://cavkoylkbcyhsifrsjyd.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_wklRlSZbzArKFCq31Ugnrw_JWAJkS4K"; 
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let activeMatch = null;

        async function authenticateMatch() {
            const matchId = document.getElementById('login-match-id').value.trim().toUpperCase();
            const pin = document.getElementById('login-pin').value.trim();
            const errBox = document.getElementById('login-error');

            if(!matchId || !pin) { errBox.innerText = "Please enter both Match ID and PIN."; return; }
            errBox.style.color = "#38bdf8";
            errBox.innerText = "⏳ Authenticating with Cloud...";

            const { data, error } = await db.from('matches').select('*').eq('match_id', matchId).eq('scorer_pin', pin).single();

            if (error || !data) {
                errBox.style.color = "#ef4444";
                errBox.innerText = "❌ Invalid Match ID or PIN.";
                return;
            }

            activeMatch = data;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('toss-screen').classList.remove('hidden');
            
            // Set Titles, but preserve the counter spans
            document.getElementById('team-a-name').innerHTML = `${activeMatch.full_state.team1} <span id="count-team-a-squad" class="counter-badge">0 Selected</span>`;
            document.getElementById('team-b-name').innerHTML = `${activeMatch.full_state.team2} <span id="count-team-b-squad" class="counter-badge">0 Selected</span>`;

            await loadTournamentSquads(activeMatch.team_a_id, 'team-a-squad');
            await loadTournamentSquads(activeMatch.team_b_id, 'team-b-squad');
        }

        async function loadTournamentSquads(teamId, containerId) {
            const container = document.getElementById(containerId);
            
            const { data, error } = await db.from('tournament_squads')
                .select('player_id, players(full_name)')
                .eq('tournament_id', activeMatch.tournament_id)
                .eq('team_id', teamId);

            if(error || !data || data.length === 0) {
                container.innerHTML = `<div style="color:#ef4444;">No players assigned to this tournament squad by Admin.</div>`;
                return;
            }

            let html = "";
            let count = 1;
            data.forEach(row => {
                if(row.players) {
                    html += `
                    <label class="player-row">
                        <input type="checkbox" class="chk-${containerId}" value="${row.player_id}" onchange="updateSelectionCount('${containerId}')" style="width:18px; height:18px; margin-right:15px;">
                        <span style="font-weight:bold; font-size:0.95rem;">${count}. ${row.players.full_name}</span>
                    </label>`;
                    count++;
                }
            });
            container.innerHTML = html;
            updateSelectionCount(containerId); // Init the counter
        }

        function updateSelectionCount(containerId) {
            let selected = document.querySelectorAll(`.chk-${containerId}:checked`).length;
            document.getElementById(`count-${containerId}`).innerText = `${selected} Selected`;
        }

        async function lockPlayingXI() {
            let teamASelected = [];
            let teamBSelected = [];

            document.querySelectorAll('.chk-team-a-squad:checked').forEach(cb => teamASelected.push(cb.value));
            document.querySelectorAll('.chk-team-b-squad:checked').forEach(cb => teamBSelected.push(cb.value));

            if(teamASelected.length === 0 || teamBSelected.length === 0) {
                alert("You must select at least 1 player for both teams to start the match!");
                return;
            }

            let updatedState = activeMatch.full_state || {};
            updatedState.playing_xi_a = teamASelected;
            updatedState.playing_xi_b = teamBSelected;

            const { error } = await db.from('matches').update({ full_state: updatedState }).eq('match_id', activeMatch.match_id);

            if(error) {
                alert("Error locking Playing XI: " + error.message);
            } else {
                alert(`✅ Playing XI Locked! \n\nTeam A: ${teamASelected.length} Players\nTeam B: ${teamBSelected.length} Players\n\nTransitioning to Live Scoreboard...`);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportzstat - Live Scoring Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px; }
        .auth-box { max-width: 400px; margin: 50px auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; }
        .btn-launch { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        /* Player Search Modal Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; border: 1px solid #334155; }
        .search-result-item { background: #0f172a; border: 1px solid #334155; padding: 10px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .search-result-item:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .player-meta { font-size: 0.75rem; color: #94a3b8; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- AUTHENTICATION GATE -->
    <div id="setupView" class="auth-box">
        <h2 style="color: #10b981; margin-top: 0; text-align: center;">Scorer Authentication</h2>
        <div class="input-group">
            <label>Match ID</label>
            <input type="text" id="match-id-input" placeholder="e.g. M-9A3K7">
        </div>
        <div class="input-group">
            <label>Scorer PIN</label>
            <input type="password" id="match-pin-input" placeholder="4-Digit PIN">
        </div>
        <button class="btn-launch" onclick="fetchOfficialMatch()">Authenticate & Sync</button>
        <div id="sync-status" style="margin-top: 15px; text-align: center; font-size: 0.9rem;"></div>
    </div>

    <!-- MAIN SCORING VIEW (Simplified Placeholder) -->
    <div id="scoringView" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px;">
            <h2 style="margin: 0; color: #38bdf8;" id="displayTournament">MATCH IN PROGRESS</h2>
            <div>
                <button onclick="openSquadEditor('A')" style="background: #3b82f6; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-right: 10px;">Edit Team A Squad</button>
                <button onclick="openSquadEditor('B')" style="background: #3b82f6; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;">Edit Team B Squad</button>
            </div>
        </div>
        
        <div style="display: flex; gap: 20px;">
            <div style="flex: 1; background: #1e293b; padding: 20px; border-radius: 8px;">
                <h3 id="nameTeamA" style="margin-top: 0;">Team A</h3>
                <div id="rosterA"></div>
            </div>
            <div style="flex: 1; background: #1e293b; padding: 20px; border-radius: 8px;">
                <h3 id="nameTeamB" style="margin-top: 0;">Team B</h3>
                <div id="rosterB"></div>
            </div>
        </div>
    </div>

    <!-- PLAYER SEARCH & REGISTRATION MODAL -->
    <div id="playerSearchModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top: 0; color: #f59e0b;" id="modal-title">Replace Player</h3>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px;">Search the master database. If the player does not exist, you must register them.</p>
            
            <input type="text" id="player-search-input" placeholder="Search by name..." style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px;" oninput="searchDatabasePlayers(this.value)">
            
            <div id="search-results-container" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;"></div>
            
            <button onclick="toggleNewPlayerForm()" style="width: 100%; padding: 10px; background: transparent; border: 1px dashed #10b981; color: #10b981; border-radius: 6px; cursor: pointer; margin-bottom: 15px;">+ Register New Player</button>
            
            <!-- Strict Registration Form -->
            <div id="new-player-form" class="hidden" style="background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 15px;">
                <div class="input-group"><label>Full Name *</label><input type="text" id="new-p-name"></div>
                <div class="input-group"><label>Father's Name *</label><input type="text" id="new-p-father"></div>
                <div class="input-group"><label>Date of Birth *</label><input type="date" id="new-p-dob"></div>
                <button onclick="registerAndSwapPlayer()" style="width: 100%; padding: 10px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Save & Insert into Lineup</button>
            </div>
            
            <button onclick="closePlayerSearchModal()" style="width: 100%; padding: 10px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer;">Cancel</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://cavkoylkbcyhsifrsjyd.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_wklRlSZbzArKFCq31Ugnrw_JWAJkS4K"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.currentScorerSession = Math.random().toString(36).substring(2, 15);
        let state = { matchId: null, teams: { A: { name: "", players: [] }, B: { name: "", players: [] } } };
        let currentTargetTeam = null;
        let currentTargetSlotIndex = null;

        // 1. CLOUD AUTHENTICATION & SESSION LOCKOUT
        async function fetchOfficialMatch() {
            const matchId = document.getElementById('match-id-input').value.trim().toUpperCase();
            const pin = document.getElementById('match-pin-input').value.trim();
            const statusEl = document.getElementById('sync-status');
            
            if(!matchId || !pin) { statusEl.innerHTML = '<span style="color: #ef4444;">❌ Enter Match ID and PIN.</span>'; return; }
            statusEl.innerHTML = '<span style="color: #f59e0b;">⏳ Authenticating & Fetching Cloud Data...</span>';

            const { data: matchRow, error: matchErr } = await supabaseClient.from('matches').select('*').eq('match_id', matchId).single();

            if (matchErr || !matchRow || matchRow.scorer_pin !== pin) {
                statusEl.innerHTML = `<span style="color: #ef4444;">❌ Access Denied. Incorrect Match ID or PIN.</span>`; return;
            }

            // Lockout Dual Scoring
            await supabaseClient.from('matches').update({ active_session: window.currentScorerSession }).eq('match_id', matchId);

            // Populate Engine Data
            const matchData = matchRow.full_state || {};
            state.matchId = matchId;
            state.teams.A.name = matchData.team1 || "Team A";
            state.teams.B.name = matchData.team2 || "Team B";

            // Initialize empty squad slots (11 slots for example) if not existing in state
            if(state.teams.A.players.length === 0) {
                for(let i=0; i<11; i++) state.teams.A.players.push({ player_id: null, name: "Empty Slot", dob: "", father_name: "" });
                for(let i=0; i<11; i++) state.teams.B.players.push({ player_id: null, name: "Empty Slot", dob: "", father_name: "" });
            }

            document.getElementById('setupView').classList.add('hidden'); 
            document.getElementById('scoringView').classList.remove('hidden'); 
            document.getElementById('displayTournament').innerText = matchData.tournament || "MATCH IN PROGRESS"; 
            document.getElementById('nameTeamA').innerText = state.teams.A.name;
            document.getElementById('nameTeamB').innerText = state.teams.B.name;
            
            renderRosters();
        }

        // 2. RENDER ROSTERS IN UI
        function renderRosters() {
            ['A', 'B'].forEach(teamKey => {
                const container = document.getElementById(teamKey === 'A' ? 'rosterA' : 'rosterB');
                container.innerHTML = state.teams[teamKey].players.map((p, index) => {
                    let playerText = p.player_id ? `<span style="color:#10b981; font-weight:bold;">${p.name}</span> <span style="font-size:0.7rem; color:#94a3b8;">(${p.player_id.substring(0,8)}...)</span>` : `<span style="color:#ef4444; font-style:italic;">${p.name}</span>`;
                    return `<div style="background:#0f172a; padding:10px; border:1px solid #334155; margin-bottom:5px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
                        <div>${index + 1}. ${playerText}</div>
                        <button onclick="openPlayerSearchModal('${teamKey}', ${index})" style="background:transparent; border:1px solid #3b82f6; color:#3b82f6; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:0.75rem;">Set/Replace</button>
                    </div>`;
                }).join('');
            });
        }

        // 3. SEARCH EXISTING PLAYERS
        function openPlayerSearchModal(teamKey, index) {
            currentTargetTeam = teamKey;
            currentTargetSlotIndex = index;
            document.getElementById('player-search-input').value = "";
            document.getElementById('search-results-container').innerHTML = "";
            document.getElementById('new-player-form').classList.add('hidden');
            document.getElementById('playerSearchModal').style.display = "flex";
        }

        function closePlayerSearchModal() { document.getElementById('playerSearchModal').style.display = "none"; }
        function toggleNewPlayerForm() { document.getElementById('new-player-form').classList.toggle('hidden'); }

        async function searchDatabasePlayers(query) {
            const container = document.getElementById('search-results-container');
            if (query.trim().length < 2) { container.innerHTML = ""; return; }
            
            container.innerHTML = '<div style="color:#94a3b8; font-size:0.8rem; text-align:center;">Searching...</div>';
            
            const { data, error } = await supabaseClient.from('players').select('*').ilike('full_name', `%${query}%`).limit(10);
            
            if (error || !data || data.length === 0) {
                container.innerHTML = '<div style="color:#ef4444; font-size:0.8rem; text-align:center;">No players found. Please register them below.</div>';
                return;
            }

            container.innerHTML = data.map(p => `
                <div class="search-result-item" onclick="assignExistingPlayer('${p.player_id}', '${p.full_name}')">
                    <div>
                        <div style="font-weight:bold; color:white;">${p.full_name}</div>
                        <div class="player-meta">DOB: ${p.dob || 'N/A'} | Father: ${p.father_name || 'N/A'}</div>
                    </div>
                    <div style="color:#10b981; font-weight:bold;">Select</div>
                </div>
            `).join('');
        }

        // 4. ASSIGN EXISTING UUID OR REGISTER NEW UUID
        function assignExistingPlayer(uuid, name) {
            state.teams[currentTargetTeam].players[currentTargetSlotIndex] = { player_id: uuid, name: name };
            renderRosters();
            closePlayerSearchModal();
        }

        async function registerAndSwapPlayer() {
            const name = document.getElementById('new-p-name').value.trim();
            const father = document.getElementById('new-p-father').value.trim();
            const dob = document.getElementById('new-p-dob').value;
            
            if(!name || !father || !dob) { alert("Please fill in all required fields (Name, Father's Name, DOB) to strictly identify this player."); return; }
            
            const btn = document.querySelector('#new-player-form button');
            btn.innerText = "Registering in Cloud...";

            const { data, error } = await supabaseClient.from('players').insert([{ 
                full_name: name, 
                father_name: father, 
                dob: dob 
            }]).select();

            if (error) {
                alert("Database Error: " + error.message);
                btn.innerText = "Save & Insert into Lineup";
                return;
            }

            const newPlayer = data[0];
            alert(`✅ ${newPlayer.full_name} successfully registered with Master ID: ${newPlayer.player_id}`);
            
            // Assign new UUID directly to the squad slot
            assignExistingPlayer(newPlayer.player_id, newPlayer.full_name);
            btn.innerText = "Save & Insert into Lineup";
        }
    </script>
</body>
</html>

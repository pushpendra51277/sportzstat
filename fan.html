<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportzstat - Fan Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
        * { box-sizing: border-box; }
        
        .header-link { color: #cbd5e1; text-decoration: none; font-size: 0.85rem; margin-bottom: 20px; display: inline-block; transition: 0.2s; }
        .header-link:hover { color: white; }
        
        h1 { color: #38bdf8; margin: 0 0 5px 0; font-size: 2rem; display: flex; align-items: center; gap: 10px; letter-spacing: 1px;}
        p.sub { color: #94a3b8; font-size: 0.9rem; border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 20px; }

        .filter-bar { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .filter-select, .search-input { background: #0f172a; color: white; border: 1px solid #475569; padding: 12px 15px; border-radius: 6px; font-size: 0.95rem; flex: 1; min-width: 160px; outline: none; transition: 0.2s; }
        .filter-select:focus, .search-input:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        .search-input { flex: 2; min-width: 250px; }

        .section-title { font-size: 1.2rem; font-weight: bold; margin: 30px 0 15px 0; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        
        .match-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 18px; margin-bottom: 15px; cursor: pointer; transition: 0.2s; position: relative; }
        .match-card:hover { border-color: #38bdf8; background: rgba(30, 41, 59, 0.8); }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        
        .tourney-name { font-size: 0.75rem; color: #94a3b8; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .match-number { background: #334155; color: #f8fafc; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 900; }
        
        .badge { font-size: 0.7rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px;}
        .badge-live { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .badge-comp { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge-up { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }

        .format-badge { background: #0f172a; color: #38bdf8; border: 1px solid #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; margin-left: 10px; }

        .teams { font-size: 1.15rem; font-weight: bold; color: white; margin-bottom: 8px; }
        .score-line { font-size: 1rem; font-weight: bold; color: #10b981; margin-bottom: 10px; }
        .overs { font-size: 0.85rem; color: #94a3b8; font-weight: normal; }
        
        .tap-details { font-size: 0.85rem; color: #64748b; margin-top: 5px; transition: 0.2s;}
        .match-card:hover .tap-details { color: #38bdf8; }

        .empty-msg { color: #64748b; font-style: italic; font-size: 0.95rem; background: #0f172a; padding: 20px; border-radius: 8px; border: 1px dashed #334155; text-align: center;}
        
        .match-details { display: none; margin-top: 15px; border-top: 1px solid #334155; padding-top: 15px; animation: fadeIn 0.3s ease; cursor: default; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .details-table { width: 100%; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 20px; border-collapse: collapse; }
        .details-table th { color: #94a3b8; border-bottom: 1px solid #334155; padding: 6px 4px; text-align: right; }
        .details-table th:first-child { text-align: left; }
        .details-table td { padding: 6px 4px; border-bottom: 1px solid #1e293b; text-align: right; }
        .details-table td:first-child { text-align: left; }
        
        /* NEW: Styles for the Meta Box (Toss, Points, Result) */
        .meta-box { margin-top: 8px; margin-bottom: 12px; font-size: 0.85rem; line-height: 1.5; background: rgba(0,0,0,0.25); padding: 10px 15px; border-radius: 6px; border-left: 3px solid #38bdf8; }
        .meta-toss { color: #cbd5e1; }
        .meta-result { color: #10b981; font-weight: bold; margin-top: 4px; font-size: 0.9rem; }
        .meta-points { color: #f59e0b; margin-top: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <a href="index.html" class="header-link">← Return to Dashboard</a>
    <h1>📺 FAN PORTAL</h1>
    <p class="sub">Live match center and global scorecards.</p>

    <!-- PRO FILTER BAR -->
    <div class="filter-bar">
        <input type="text" id="fan-search-input" class="search-input" placeholder="🔍 Search Teams or Tournaments..." onkeyup="renderFanMatches()">
        <select id="filter-team" class="filter-select" onchange="renderFanMatches()"><option value="ALL">🛡️ All Teams</option></select>
        <select id="filter-tourney" class="filter-select" onchange="renderFanMatches()"><option value="ALL">🏆 All Tournaments</option></select>
        <select id="filter-format" class="filter-select" onchange="renderFanMatches()"><option value="ALL">🏏 All Formats</option></select>
    </div>

    <!-- LIVE MATCHES -->
    <div class="section-title" style="color: #ef4444;">🔴 Live Matches</div>
    <div id="live-container"><div class="empty-msg">Fetching live action...</div></div>

    <!-- COMPLETED MATCHES -->
    <div class="section-title" style="color: #10b981;">✅ Completed Matches</div>
    <div id="comp-container"><div class="empty-msg">Fetching recent results...</div></div>

    <!-- UPCOMING MATCHES -->
    <div class="section-title" style="color: #f59e0b;">📅 Upcoming Fixtures</div>
    <div id="up-container"><div class="empty-msg">Fetching scheduled games...</div></div>

    <script>
        const SUPABASE_URL = "https://cavkoylkbcyhsifrsjyd.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_wklRlSZbzArKFCq31Ugnrw_JWAJkS4K"; 
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allFanMatches = [];
        let expandedMatches = new Set();

        window.onload = async () => {
            await fetchMatches();
            setInterval(fetchMatches, 10000); 
        };

        function toggleDetails(matchId, event) {
            const detailsDiv = document.getElementById('details-' + matchId);
            if (detailsDiv.style.display === 'none' || detailsDiv.style.display === '') {
                detailsDiv.style.display = 'block';
                expandedMatches.add(matchId);
            } else {
                detailsDiv.style.display = 'none';
                expandedMatches.delete(matchId);
            }
        }

        async function fetchMatches() {
            const { data, error } = await db.from('matches').select('match_id, full_state, tournaments(name)').order('created_at', { ascending: false });
            if (error) { console.error("Cloud Error:", error); return; }
            
            allFanMatches = data || [];
            
            let filterSets = { teams: new Set(), tourneys: new Set(), formats: new Set() };
            
            allFanMatches.forEach(m => {
                let fs = m.full_state || {};
                
                let t1 = fs.team1 || (fs.teams?.A?.name);
                let t2 = fs.team2 || (fs.teams?.B?.name);
                let tourney = (m.tournaments && m.tournaments.name) ? m.tournaments.name : fs.tournament;
                
                let format = fs.format;
                if (!format || format === 'undefined' || format === '') {
                    if (fs.matchSettings && fs.matchSettings.matchType === 'multiday') { format = 'Multi-Day (Test)'; } 
                    else if (fs.inningsSummaries && fs.inningsSummaries.length > 2) { format = 'Multi-Day (Test)'; } 
                    else if (fs.matchSettings && fs.matchSettings.matchType === 'oneday') { format = 'One Day (ODI)'; } 
                    else { format = 'T20'; }
                }

                if (t1) filterSets.teams.add(t1);
                if (t2) filterSets.teams.add(t2);
                if (tourney) filterSets.tourneys.add(tourney);
                if (format) filterSets.formats.add(format);
                
                m.computedFormat = format || 'T20';
            });

            let updateDropdown = (id, set, defaultText) => { 
                let el = document.getElementById(id); 
                let currentVal = el.value;
                el.innerHTML = `<option value="ALL">${defaultText}</option>`;
                Array.from(set).sort().forEach(v => el.innerHTML += `<option value="${v}">${v}</option>`); 
                if (Array.from(set).includes(currentVal)) el.value = currentVal;
            };

            updateDropdown('filter-team', filterSets.teams, '🛡️ All Teams');
            updateDropdown('filter-tourney', filterSets.tourneys, '🏆 All Tournaments');
            updateDropdown('filter-format', filterSets.formats, '🏏 All Formats');

            renderFanMatches();
        }

        function renderFanMatches() {
            const query = document.getElementById('fan-search-input').value.toLowerCase().trim();
            const fTeam = document.getElementById('filter-team').value;
            const fTourn = document.getElementById('filter-tourney').value;
            const fForm = document.getElementById('filter-format').value;
            
            let liveHtml = '', compHtml = '', upHtml = '';
            let liveCnt = 1, compCnt = 1, upCnt = 1;

            allFanMatches.forEach(m => {
                let fs = m.full_state || {};
                
                let t1 = fs.team1 || (fs.teams?.A?.name) || 'Team 1';
                let t2 = fs.team2 || (fs.teams?.B?.name) || 'Team 2';
                let tourney = (m.tournaments && m.tournaments.name) ? m.tournaments.name : (fs.tournament || 'Independent Match');
                let status = (fs.match_status || 'upcoming').toLowerCase();
                let format = m.computedFormat;

                if (fTeam !== 'ALL' && t1 !== fTeam && t2 !== fTeam) return;
                if (fTourn !== 'ALL' && tourney !== fTourn) return;
                if (fForm !== 'ALL' && format !== fForm) return;
                
                let searchStr = `${t1} ${t2} ${tourney}`.toLowerCase();
                if (query && !searchStr.includes(query)) return; 

                let scoreText = '';
                if (status === 'live' || status === 'completed') {
                    let batTeam = fs.teams?.[fs.battingKey]?.name || t1;
                    let runs = fs.current?.runs || 0;
                    let wkts = fs.current?.wkts || 0;
                    let rawBalls = fs.current?.balls || 0;
                    let overs = Math.floor(rawBalls / 6) + "." + (rawBalls % 6);
                    let scoreColor = status === 'completed' ? 'color:#38bdf8;' : '';
                    scoreText = `<div class="score-line" style="${scoreColor}">${batTeam}: ${runs}/${wkts} <span class="overs">(${overs} ov)</span></div>`;
                }

                // 🔥 NEW: Extract Toss, Result, and Points from fan_portal_summary
                let fps = fs.fan_portal_summary || {};
                let tossStr = fps.toss && fps.toss !== "Toss not recorded" ? `🪙 ${fps.toss}` : '';
                let resultStr = '';
                let pointsStr = '';

                // Only show Result and Points if match is actually completed
                if (status === 'completed') {
                    if (fps.result && fps.result !== "Match in Progress") {
                        resultStr = `🏆 ${fps.result}`;
                    }
                    if (fps.team_points) {
                        let ptsArr = [];
                        for (const [tName, pts] of Object.entries(fps.team_points)) {
                            ptsArr.push(`${tName}: ${pts}`);
                        }
                        if (ptsArr.length > 0) {
                            pointsStr = `📊 Points: ${ptsArr.join(' | ')}`;
                        }
                    }
                }

                // 🔥 NEW: Build the Meta Box HTML
                let metaHtml = '';
                if (tossStr || resultStr || pointsStr) {
                    metaHtml += `<div class="meta-box">`;
                    if (tossStr) metaHtml += `<div class="meta-toss">${tossStr}</div>`;
                    if (resultStr) metaHtml += `<div class="meta-result">${resultStr}</div>`;
                    if (pointsStr) metaHtml += `<div class="meta-points">${pointsStr}</div>`;
                    metaHtml += `</div>`;
                }

                let isExpanded = expandedMatches.has(m.match_id) ? 'style="display: block;"' : '';
                let detailsHtml = `<div class="match-details" id="details-${m.match_id}" ${isExpanded} onclick="event.stopPropagation()">`;
                
                if (fs.inningsSummaries && fs.inningsSummaries.length > 0) {
                    fs.inningsSummaries.forEach((inn, idx) => {
                        detailsHtml += `<div style="color:#38bdf8; font-weight:bold; margin-bottom:10px; font-size: 0.9rem; text-transform: uppercase;">Innings ${idx+1} - ${inn.batTeam}</div>`;
                        
                        // Batters Table
                        detailsHtml += `<table class="details-table">
                            <tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>`;
                        (inn.batters || []).filter(b => b.hasBatted).forEach(b => {
                            let sr = b.b > 0 ? ((b.r/b.b)*100).toFixed(1) : '0.0';
                            let outStr = b.out ? (b.dismissalInfo || 'out') : 'not out';
                            detailsHtml += `<tr>
                                <td><span style="font-weight:bold; color:white;">${b.name}</span><div style="font-size:0.65rem; color:#64748b;">${outStr}</div></td>
                                <td style="font-weight:bold; color:white;">${b.r}</td><td>${b.b}</td><td>${b.f}</td><td>${b.s}</td><td>${sr}</td>
                            </tr>`;
                        });
                        detailsHtml += `</table>`;

                        // Bowlers Table
                        detailsHtml += `<table class="details-table">
                            <tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th></tr>`;
                        (inn.bowlers || []).filter(bw => bw.o > 0 || bw.rc > 0).forEach(bw => {
                            let oVal = Number(bw.o) || 0;
                            let oversStr = "";
                            let absBalls = 0;
                            
                            if (oVal % 1 !== 0) {
                                oversStr = Math.floor(oVal) + "." + Math.round((oVal - Math.floor(oVal)) * 10);
                                absBalls = Math.floor(oVal) * 6 + Math.round((oVal - Math.floor(oVal)) * 10);
                            } else {
                                oversStr = Math.floor(oVal / 6) + "." + (oVal % 6);
                                absBalls = oVal;
                            }
                            
                            let econ = absBalls > 0 ? ((bw.rc/absBalls)*6).toFixed(2) : '0.00';
                            
                            detailsHtml += `<tr>
                                <td><span style="font-weight:bold; color:white;">${bw.name}</span></td>
                                <td>${oversStr}</td><td>${bw.m}</td><td>${bw.rc}</td><td style="font-weight:bold; color:#10b981;">${bw.w}</td><td>${econ}</td>
                            </tr>`;
                        });
                        detailsHtml += `</table>`;
                    });
                } else {
                    detailsHtml += `<div style="color:#64748b; font-style:italic; text-align:center; padding: 10px;">Scorecard details will appear once the match begins.</div>`;
                }
                detailsHtml += `</div>`;

                // 🔥 NEW: Injecting the metaHtml into the card
                let createCard = (num, badgeClass, badgeText) => `
                    <div class="match-card" onclick="toggleDetails('${m.match_id}', event)">
                        <div class="card-header">
                            <div class="tourney-name"><span class="match-number">#${num}</span> ${tourney} <span class="format-badge">${format}</span></div>
                            <div class="badge ${badgeClass}">● ${badgeText}</div>
                        </div>
                        <div class="teams">${t1} <span style="color:#64748b; font-size:0.85em; font-weight:normal; margin: 0 5px;">vs</span> ${t2}</div>
                        ${scoreText}
                        ${metaHtml}
                        <div class="tap-details">Tap card to expand scorecard ↓</div>
                        ${detailsHtml}
                    </div>
                `;

                if (status === 'live' || status === 'innings_break') { 
                    liveHtml += createCard(liveCnt++, 'badge-live', 'LIVE'); 
                }
                else if (status === 'completed') { 
                    compHtml += createCard(compCnt++, 'badge-comp', 'COMPLETED'); 
                }
                else { 
                    upHtml += createCard(upCnt++, 'badge-up', 'UPCOMING'); 
                }
            });

            document.getElementById('live-container').innerHTML = liveHtml || '<div class="empty-msg">No active matches matching your criteria.</div>';
            document.getElementById('comp-container').innerHTML = compHtml || '<div class="empty-msg">No completed matches matching your criteria.</div>';
            document.getElementById('up-container').innerHTML = upHtml || '<div class="empty-msg">No upcoming fixtures matching your criteria.</div>';
        }
    </script>
</body>
</html>
